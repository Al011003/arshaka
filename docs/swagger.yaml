basePath: /
definitions:
  auth.LoginRequest:
    properties:
      nra:
        type: string
      password:
        type: string
    type: object
  auth.RegisterAdminRequest:
    properties:
      nama:
        type: string
      nama_lengkap:
        type: string
      nra:
        type: string
    type: object
  auth.RegisterUserRequest:
    properties:
      angkatan_kampus:
        type: string
      angkatan_mapala:
        type: string
      fakultas:
        type: string
      jurusan:
        type: string
      nama:
        type: string
      nama_lengkap:
        type: string
      nim:
        type: string
      no_hp:
        type: string
      nra:
        type: string
    type: object
  auth.RequestOTPRequest:
    properties:
      email:
        example: user@mail.com
        type: string
    type: object
  auth.ResetPasswordRequest:
    properties:
      new_password:
        example: password123
        type: string
      reset_token:
        example: abc123
        type: string
    type: object
  auth.UpdatePasswordRequest:
    properties:
      new_confirm_password:
        type: string
      new_password:
        type: string
      old_password:
        type: string
    type: object
  auth.VerifyResetOTPRequest:
    properties:
      email:
        example: user@mail.com
        type: string
      otp:
        example: "123456"
        type: string
    type: object
  barang.CreateBarangRequest:
    properties:
      deskripsi:
        type: string
      harga_beli:
        type: number
      kategori:
        type: string
      kode:
        type: string
      merk:
        type: string
      nama:
        type: string
      stok_sisa:
        type: integer
      stok_total:
        type: integer
      tahun_beli:
        type: integer
    type: object
  barang.UpdateBarangRequest:
    properties:
      deskripsi:
        type: string
      harga_beli:
        type: number
      kategori:
        type: string
      kode:
        type: string
      merk:
        type: string
      nama:
        type: string
      status:
        description: ← TAMBAH INI
        type: string
      stok_sisa:
        type: integer
      stok_total:
        type: integer
      tahun_beli:
        type: integer
    type: object
  response.BaseResponse:
    properties:
      data: {}
      message: {}
      status:
        type: string
    type: object
info:
  contact:
    email: support@example.com
    name: API Support
  description: API Documentation untuk Frontend
  termsOfService: http://swagger.io/terms/
  title: Backend API
  version: "1.0"
paths:
  /api/admin/barang:
    get:
      consumes:
      - application/json
      description: Mengambil semua data barang dengan filter dan pagination
      parameters:
      - description: Filter by status (aktif/tidak_aktif)
        in: query
        name: status
        type: string
      - description: Filter by kategori
        in: query
        name: kategori
        type: string
      - description: Search by nama or kode
        in: query
        name: search
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10)'
        in: query
        name: limit
        type: integer
      - description: 'Sort field (default: created_at)'
        in: query
        name: sort_by
        type: string
      - description: 'Sort order: asc/desc (default: desc)'
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Data barang berhasil diambil
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get all barang
      tags:
      - barang
    post:
      consumes:
      - application/json
      description: Membuat barang baru (admin only)
      parameters:
      - description: Barang data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/barang.CreateBarangRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Barang berhasil dibuat
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request - validation error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Create new barang
      tags:
      - barang
  /api/admin/barang/{id}:
    delete:
      consumes:
      - application/json
      description: Menghapus barang berdasarkan ID (admin only)
      parameters:
      - description: Barang ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Barang berhasil dihapus
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request - ID tidak valid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Barang tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Delete barang
      tags:
      - barang
    get:
      consumes:
      - application/json
      description: Mengambil detail barang berdasarkan ID
      parameters:
      - description: Barang ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Data barang berhasil diambil
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request - ID tidak valid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Barang tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get barang by ID
      tags:
      - barang
    put:
      consumes:
      - application/json
      description: Update data barang berdasarkan ID (admin only)
      parameters:
      - description: Barang ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated barang data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/barang.UpdateBarangRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Barang berhasil diupdate
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request - validation error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Barang tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Update barang
      tags:
      - barang
  /api/super-admin/register-admin:
    post:
      consumes:
      - application/json
      description: Mendaftarkan admin baru (hanya bisa dilakukan oleh super admin)
      parameters:
      - description: Admin registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterAdminRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Admin berhasil dibuat
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request - validation error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized - token tidak valid atau tidak ada
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Register new admin
      tags:
      - auth
  /api/super-admin/register-user:
    post:
      consumes:
      - application/json
      description: Mendaftarkan user/anggota baru ke sistem
      parameters:
      - description: User registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User berhasil dibuat
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request - validation error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized - token tidak valid atau tidak ada
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Register new user/anggota
      tags:
      - auth
  /api/user/password:
    post:
      consumes:
      - application/json
      description: Update password untuk user yang sedang login (memerlukan old password)
      parameters:
      - description: Old password and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.UpdatePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password berhasil diperbarui
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request - validation error atau old password salah
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized - user tidak ditemukan dalam token
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Update user password
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login menggunakan email dan password
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login berhasil
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.BaseResponse'
      summary: User login
      tags:
      - auth
  /auth/request-otp:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email user
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RequestOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.BaseResponse'
      summary: Request OTP reset password
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Reset token dan password baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.BaseResponse'
      summary: Reset password
      tags:
      - auth
  /auth/verify-reset-otp:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email dan OTP
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.VerifyResetOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.BaseResponse'
      summary: Verifikasi OTP reset password
      tags:
      - auth
securityDefinitions:
  ApiKeyAuth:
    description: JWT token tanpa prefix Bearer
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
